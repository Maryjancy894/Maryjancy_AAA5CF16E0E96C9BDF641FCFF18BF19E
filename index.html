<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Birthday Priya 💖</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{

    height:100vh;
    overflow:hidden;

    display:flex;
    justify-content:center;
    align-items:center;

    text-align:center;
    color:white;

    /* Background Photo */

    background-image:url("photo.jpeg");

    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
}

/* Dark Overlay */

.overlay{

    position:absolute;

    top:0;
    left:0;

    width:100%;
    height:100%;

    background:rgba(0,0,0,0.45);
}

/* Main Content */

.content{

    position:relative;
    z-index:2;

    padding:20px;
}

h1{

    font-size:65px;

    animation:glow 2s infinite alternate;
}

h2{

    font-size:45px;

    margin-top:15px;

    color:pink;
}

p{

    font-size:24px;

    margin-top:20px;
}

/* Glow Animation */

@keyframes glow{

    from{

        text-shadow:
        0 0 10px white,
        0 0 20px pink,
        0 0 40px hotpink;
    }

    to{

        text-shadow:
        0 0 20px white,
        0 0 40px pink,
        0 0 60px hotpink;
    }
}

/* Hearts */

.heart{

    position:absolute;

    bottom:-50px;

    font-size:35px;

    animation:hearts 8s linear infinite;
}

@keyframes hearts{

    0%{

        transform:translateY(0);

        opacity:1;
    }

    100%{

        transform:translateY(-120vh);

        opacity:0;
    }
}

/* Balloons */

.balloon{

    position:absolute;

    bottom:-150px;

    font-size:70px;

    animation:balloons 12s linear infinite;
}

@keyframes balloons{

    0%{

        transform:translateY(0);
    }

    100%{

        transform:translateY(-130vh);
    }
}

</style>

</head>

<body>

<div class="overlay"></div>

<!-- Hearts -->

<div class="heart" style="left:10%; animation-duration:6s;">❤️</div>

<div class="heart" style="left:25%; animation-duration:8s;">💖</div>

<div class="heart" style="left:45%; animation-duration:7s;">💕</div>

<div class="heart" style="left:65%; animation-duration:9s;">❤️</div>

<div class="heart" style="left:85%; animation-duration:6s;">💖</div>


<!-- Balloons -->

<div class="balloon" style="left:15%; animation-duration:10s;">🎈</div>

<div class="balloon" style="left:50%; animation-duration:12s;">🎈</div>

<div class="balloon" style="left:80%; animation-duration:9s;">🎈</div>


<!-- Birthday Content -->

<div class="content">

    <h1>🎂 Happy Birthday 🎉</h1>

    <h2>❤️ PRIYA ❤️</h2>

    <p>
        Wishing you lots of happiness 💖
    </p>

    <p>
        Stay happy forever ✨
    </p>

</div>

</body>

</html>
